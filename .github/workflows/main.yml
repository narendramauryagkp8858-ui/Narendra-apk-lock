
name: Narendra AppLock APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find Android Project
        id: project
        run: |
          FILE=$(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) -not -path './.git/*' | head -n 1)
          if [ -z "$FILE" ]; then
            echo "ERROR: settings.gradle not found!"
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "dir=$DIR" >> $GITHUB_OUTPUT
          echo "Project found: $DIR"

      - name: Build Narendra AppLock APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Narendra-AppLock-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
